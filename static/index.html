<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MLB Batting Questions</title><style>body{font:18px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem;background:#f7f8fa;color:#17253b}textarea{box-sizing:border-box;width:100%;padding:1rem;font:inherit}button{padding:.7rem 1.2rem;font:inherit;background:#173d68;color:white;border:0;border-radius:6px}table{border-collapse:collapse;width:100%;margin:1rem 0}td,th{padding:.6rem;text-align:left;border-bottom:1px solid #ccd3dd}label{display:block;margin:1rem 0}.panel{background:white;padding:1.5rem;border-radius:10px;margin-top:1rem}#status{min-height:1.5rem}</style></head><body><h1>MLB batting questions</h1><p>Explore the imported regular-season snapshots. Ask a complete question including a player and season.</p><form id="question-form"><label for="question">Your question</label><textarea id="question" rows="3" maxlength="4000" required placeholder="What was Luis Vázquez's OPS in 2025?"></textarea><button id="submit" type="submit">Ask question</button></form><label><input type="checkbox" id="show-table" checked> Show supporting results</label><p id="status" role="status" aria-live="polite"></p><section id="results" aria-live="polite"></section><script>
const form=document.querySelector('#question-form'), status=document.querySelector('#status'), results=document.querySelector('#results'), toggle=document.querySelector('#show-table');
toggle.addEventListener('change',()=>document.querySelectorAll('table').forEach(t=>t.hidden=!toggle.checked));
form.addEventListener('submit',async e=>{e.preventDefault();results.replaceChildren();status.textContent='Looking up the answer…';document.querySelector('#submit').disabled=true;try{const response=await fetch('/api/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value})});const data=await response.json();status.textContent='';if(data.message){const p=document.createElement('p');p.textContent=data.message;results.append(p)}for(const outcome of data.strategies||[]){const panel=document.createElement('article');panel.className='panel';const answer=document.createElement('p');answer.textContent=outcome.message;panel.append(answer);if(data.seasons?.length){const seasons=document.createElement('p');seasons.textContent='Season snapshots: '+data.seasons.join(', ');panel.append(seasons)}if(outcome.table){const table=document.createElement('table');table.hidden=!toggle.checked;const head=document.createElement('thead'), tr=document.createElement('tr');for(const label of outcome.table.columns){const th=document.createElement('th');th.scope='col';th.textContent=label;tr.append(th)}head.append(tr);table.append(head);const body=document.createElement('tbody');for(const row of outcome.table.rows){const tr=document.createElement('tr');for(const value of row){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)}table.append(body);panel.append(table)}results.append(panel)}}catch{status.textContent="I couldn't reach the application. Please try again."}finally{document.querySelector('#submit').disabled=false}});
</script></body></html>
